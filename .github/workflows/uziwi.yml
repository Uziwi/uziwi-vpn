name: Сборка Uziwi VPN

# Собирает APK на машине GitHub и кладёт его в «Артефакты» запуска.
#
# Зачем здесь, а не на своём сервере: Gradle просит 2–4 ГБ памяти и
# грузит процессор в полку. На рижском сервере одно ядро и ~900 МБ
# свободной памяти, и он же обслуживает клиентов — сборка там уронила
# бы скорость людям, которые платят.
#
# Сборка ОТЛАДОЧНАЯ (debug). Она подписана временным ключом самого
# Android — ставится на телефон как есть, ключи заводить не нужно.
# Для раздачи клиентам потом сделаем release со своим ключом.

on:
  workflow_dispatch:        # запуск кнопкой
  push:
    branches:
      - uziwi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --channel=0 --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          # Версия NDK дописывается в build.gradle.kts на лету — так же,
          # как это делает сборка исходного проекта.
          sed -i '10i\
          \
              ndkVersion = "29.0.14206865"' "$GITHUB_WORKSPACE/V2rayNG/app/build.gradle.kts"

      - name: Собрать libhevtun
        run: bash compile-hevtun.sh

      - name: Положить libhevtun на место
        run: cp -r "$GITHUB_WORKSPACE/libs" "$GITHUB_WORKSPACE/V2rayNG/app"

      - name: Узнать версию ядра Xray
        run: |
          pushd AndroidLibXrayLite
          echo "CURRENT_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
          popd

      - name: Скачать готовое ядро libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Собрать APK
        run: |
          cd "$GITHUB_WORKSPACE/V2rayNG"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Показать, что получилось
        run: find "$GITHUB_WORKSPACE/V2rayNG/app/build/outputs/apk" -name "*.apk" -exec ls -lh {} \;

      # Телефоны почти все arm64. Остальные сборки тоже кладём —
      # вдруг у кого-то старое устройство.
      - name: Выложить APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: UziwiVPN-apk
          path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
